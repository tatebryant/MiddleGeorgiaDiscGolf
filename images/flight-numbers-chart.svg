<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="Disc Golf Flight Numbers Diagram: Speed, Glide, Turn, Fade">
  <rect width="900" height="360" rx="12" fill="#242424" stroke="#BA0C2F" stroke-width="2" />
  <text x="450" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">HOW DISC GOLF FLIGHT NUMBERS WORK</text>
  <text x="450" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#E5E5E5" text-anchor="middle">Standard Four-Number Flight Rating System: Speed | Glide | Turn | Fade</text>
  <g transform="translate(40, 100)">
    <rect width="185" height="220" rx="8" fill="#1A1A1A" stroke="#BA0C2F" stroke-width="2" />
    <rect x="0" y="0" width="185" height="42" rx="8" fill="#BA0C2F" />
    <text x="92" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1. SPEED (1 to 14)</text>
    <text x="92" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FF5C77" text-anchor="middle">Rim Width &amp; Velocity</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E5E5E5">
      <tspan x="18" dy="0">Measures required arm</tspan>
      <tspan x="18" dy="18">speed to achieve flight.</tspan>
      <tspan x="18" dy="24" font-weight="700" fill="#FFFFFF">• 1-3: Putters</tspan>
      <tspan x="18" dy="18" font-weight="700" fill="#FFFFFF">• 4-5: Midranges</tspan>
      <tspan x="18" dy="18" font-weight="700" fill="#FFFFFF">• 6-9: Fairways</tspan>
      <tspan x="18" dy="18" font-weight="700" fill="#FFFFFF">• 10-14: Distance</tspan>
    </text>
  </g>
  <g transform="translate(250, 100)">
    <rect width="185" height="220" rx="8" fill="#1A1A1A" stroke="#444" stroke-width="1.5" />
    <rect x="0" y="0" width="185" height="42" rx="8" fill="#333333" />
    <text x="92" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2. GLIDE (1 to 7)</text>
    <text x="92" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Loft &amp; Airtime Carry</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E5E5E5">
      <tspan x="18" dy="0">Ability to maintain loft</tspan>
      <tspan x="18" dy="18">during flight trajectory.</tspan>
      <tspan x="18" dy="24" font-weight="700" fill="#FFFFFF">• 1-2: Low glide, drops fast</tspan>
      <tspan x="18" dy="18">(great for wind &amp; range)</tspan>
      <tspan x="18" dy="22" font-weight="700" fill="#FFFFFF">• 5-7: High float &amp; maximum</tspan>
      <tspan x="18" dy="18">downfield carry</tspan>
    </text>
  </g>
  <g transform="translate(460, 100)">
    <rect width="185" height="220" rx="8" fill="#1A1A1A" stroke="#444" stroke-width="1.5" />
    <rect x="0" y="0" width="185" height="42" rx="8" fill="#333333" />
    <text x="92" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3. TURN (+1 to -5)</text>
    <text x="92" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">High-Speed Stability</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E5E5E5">
      <tspan x="18" dy="0">Early rightward drift</tspan>
      <tspan x="18" dy="18">on right-hand backhand.</tspan>
      <tspan x="18" dy="24" font-weight="700" fill="#FFFFFF">• 0 to +1: Overstable (resists</tspan>
      <tspan x="18" dy="18">turn, fights headwind)</tspan>
      <tspan x="18" dy="22" font-weight="700" fill="#FFFFFF">• -2 to -5: Understable</tspan>
      <tspan x="18" dy="18">(flips flat, turnovers)</tspan>
    </text>
  </g>
  <g transform="translate(670, 100)">
    <rect width="185" height="220" rx="8" fill="#1A1A1A" stroke="#BA0C2F" stroke-width="2" />
    <rect x="0" y="0" width="185" height="42" rx="8" fill="#BA0C2F" />
    <text x="92" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4. FADE (0 to 5)</text>
    <text x="92" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FF5C77" text-anchor="middle">Low-Speed Hook Finish</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E5E5E5">
      <tspan x="18" dy="0">Leftward hook as forward</tspan>
      <tspan x="18" dy="18">momentum decelerates.</tspan>
      <tspan x="18" dy="24" font-weight="700" fill="#FFFFFF">• 0-1: Mild straight finish</tspan>
      <tspan x="18" dy="18">(settles flat on fairway)</tspan>
      <tspan x="18" dy="22" font-weight="700" fill="#FFFFFF">• 3-5: Strong dump &amp; skip</tspan>
      <tspan x="18" dy="18">(trustworthy hyzer)</tspan>
    </text>
  </g>
</svg>